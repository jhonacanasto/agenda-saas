<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicios - SaaS Agenda</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --pink: #ec4899; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: #111827; padding: 20px; border-right: 1px solid #1e293b; display:flex; flex-direction:column; }
    .nav-a { display: block; padding: 12px; color: #94a3b8; text-decoration: none; border-radius: 8px; margin-bottom: 6px; font-weight: 600; }
    .nav-a.active, .nav-a:hover { background: rgba(56,189,248,0.15); color: var(--accent); }
    .content { flex: 1; padding: 30px; }
    .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
    @media(max-width: 768px) { body { flex-direction: column; } .sidebar { width: 100%; box-sizing:border-box; } }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3 style="color:var(--accent);">⚡ Agenda SaaS</h3>
    <a href="ejercicios.html" class="nav-a active">🏋️‍♂️ Ejercicios</a>
    <a href="proyectos.html" class="nav-a">📊 Proyectos</a>
    <a href="tareas.html" class="nav-a">✅ Tareas</a>
    <a href="pensamientos.html" class="nav-a">🧠 Pensamientos</a>
    <button onclick="logout()" style="margin-top:auto; background:#ef4444; color:white; border:none; padding:8px; border-radius:6px; cursor:pointer;">Cerrar Sesión</button>
  </div>

  <div class="content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2>🏋️ Rutinas de Hoy (<span id="txtDia"></span>)</h2>
      <button onclick="cargarRutinas(false)" style="background:#334155; color:white; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;">Ver Toda la Semana</button>
    </div>
    <div id="contenedor">Cargando rutinas...</div>
  </div>

  <script>
    const API_URL = window.location.hostname.includes('vercel.app') ? '/api' : 'http://127.0.0.1:8000';
    const user = JSON.parse(localStorage.getItem('usuarioActual'));
    if (!user) window.location.href = 'index.html';

    async function cargarRutinas(soloHoy = true) {
      const cont = document.getElementById('contenedor');
      const url = soloHoy ? `${API_URL}/rutinas/cliente/${user.username}/hoy` : `${API_URL}/rutinas/cliente/${user.username}`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        const list = soloHoy ? data.rutinas : data;
        document.getElementById('txtDia').innerText = soloHoy ? data.dia_actual : 'Semana Completa';

        if (!list || list.length === 0) {
          cont.innerHTML = '<div class="card"><p style="color:#94a3b8; margin:0;">ℹ️ No tienes rutinas asignadas para este período.</p></div>';
          return;
        }

        cont.innerHTML = '';
        list.forEach(r => {
          const div = document.createElement('div');
          div.className = 'card';
          if (r.tipo === 'directa_video') {
            div.innerHTML = `
              <h4 style="margin:0; color:var(--accent);">📹 Rutina: ${r.nombre_rutina} (${r.dia_semana})</h4>
              <a href="${r.enlace_video}" target="_blank" style="display:inline-block; margin-top:12px; background:var(--pink); color:white; padding:8px 16px; border-radius:6px; text-decoration:none; font-weight:bold;">▶️ Ver Video en YouTube</a>
            `;
          } else {
            let ejs = (r.ejercicios || []).map(e => `<p style="margin:4px 0; color:#94a3b8;">• <strong>${e.nombre_ejercicio}</strong> - Peso: ${e.peso} | Series: ${e.numero_repeticiones}</p>`).join('');
            div.innerHTML = `<h4 style="margin:0 0 10px 0; color:var(--accent);">📋 ${r.titulo_rutina} (${r.dia_semana})</h4>${ejs}`;
          }
          cont.appendChild(div);
        });
      } catch (e) {
        cont.innerHTML = '<p style="color:#ef4444;">Error cargando rutinas.</p>';
      }
    }

    function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    cargarRutinas(true);
  </script>
</body>
</html>
