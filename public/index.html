<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - SaaS Agenda</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 360px; border: 1px solid rgba(255,255,255,0.1); }
    input { width: 100%; padding: 10px; margin: 8px 0 16px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #38bdf8; border: none; color: #0f172a; font-weight: bold; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin-top:0; text-align:center;">🔐 Iniciar Sesión</h2>
    <label>Usuario</label>
    <input type="text" id="userInput" placeholder="Usuario">
    <label>Contraseña</label>
    <input type="password" id="passInput" placeholder="••••••••">
    <button onclick="login()">Ingresar</button>
    <p id="err" style="color:#ef4444; font-size:0.88rem; text-align:center; margin-bottom:0;"></p>
  </div>

  <script>
    const API_URL = window.location.hostname.includes('vercel.app') ? '/api' : 'http://127.0.0.1:8000';

    async function login() {
      const user = document.getElementById('userInput').value.trim();
      const pass = document.getElementById('passInput').value.trim();
      const err = document.getElementById('err');
      err.innerText = '';

      try {
        const res = await fetch(`${API_URL}/login/`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username: user, password: pass })
        });

        if (!res.ok) {
          err.innerText = 'Usuario o contraseña incorrectos';
          return;
        }

        const data = await res.json();
        localStorage.setItem('usuarioActual', JSON.stringify(data));

        if (data.rol === 'entrenador') {
          window.location.href = 'panel_entrenador.html';
        } else {
          window.location.href = 'ejercicios.html';
        }
      } catch (e) {
        err.innerText = 'Error de conexión con el servidor.';
      }
    }
  </script>
</body>
</html>
